<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Toolbit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f6f6f9;--text:#17171c;--muted:#6b6b78;--accent:#4f7cf0;--track:#e3e3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f13;--text:#ececf2;--muted:#9696a6;--accent:#6f8dff;--track:#2a2a36}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI Variable","Segoe UI",system-ui,sans-serif}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.logo{width:52px;height:52px;border-radius:14px;box-shadow:0 8px 28px rgba(99,102,241,.35)}
b{font-size:18px}
.bar{width:180px;height:3px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:var(--accent);border-radius:3px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
small{color:var(--muted)}
</style></head>
<body><div class="wrap"><img class="logo" src="icon.svg" alt=""><b>Toolbit</b><div class="bar"><i></i></div><small id="msg">Starting…</small></div>
<script>
const to = new URLSearchParams(location.search).get("to") || "http://127.0.0.1:47615/";
const t0 = Date.now();
function probe(){
  const img = new Image();
  img.onload = () => location.replace(to);
  img.onerror = () => {
    if (Date.now() - t0 > 6000) document.getElementById("msg").textContent = "Still starting… (first start after an update takes longer)";
    setTimeout(probe, 150);
  };
  img.src = to + "icon.svg?t=" + Date.now();
}
probe();
</script></body></html>
